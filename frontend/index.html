<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magyar AI Chat</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column}
    header{background:#161b27;border-bottom:1px solid #2d3748;padding:.9rem 1.5rem;display:flex;align-items:center;gap:.75rem}
    header h1{font-size:1.1rem;font-weight:700;color:#a78bfa}
    .badge{background:#1a1a2e;color:#a78bfa;font-size:.7rem;padding:.2rem .6rem;border-radius:99px;margin-left:auto}
    #chat{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:.75rem;max-width:800px;width:100%;margin:0 auto}
    .msg{max-width:78%;padding:.75rem 1rem;border-radius:14px;font-size:.92rem;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    .msg.user{align-self:flex-end;background:#4f46e5;color:#fff;border-bottom-right-radius:4px}
    .msg.bot{align-self:flex-start;background:#1e1e2a;color:#e2e8f0;border:1px solid #2a2a3a;border-bottom-left-radius:4px}
    .msg.thinking{opacity:.5;font-style:italic}
    .input-bar{background:#161b27;border-top:1px solid #2d3748;padding:.9rem 1.5rem}
    .model-bar{display:flex;align-items:center;gap:.5rem;max-width:800px;margin:.5rem auto 0;font-size:.78rem;color:#718096}
    select{background:#0f1117;border:1px solid #2d3748;border-radius:6px;color:#a0aec0;padding:.25rem .5rem;font-size:.78rem;cursor:pointer;outline:none}
    .input-inner{display:flex;gap:.6rem;max-width:800px;margin:.5rem auto 0}
    textarea{flex:1;background:#0f1117;border:1px solid #2d3748;border-radius:10px;padding:.65rem 1rem;color:#e2e8f0;font-size:.92rem;outline:none;font-family:inherit;resize:none;max-height:140px}
    textarea:focus{border-color:#4f46e5}
    button#send{background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:0 1.1rem;cursor:pointer;font-size:1.2rem}
    button#send:hover{background:#4338ca}
    button#send:disabled{background:#2d3748;cursor:not-allowed}
  </style>
</head>
<body>
<header>
  <span>🇭🇺</span>
  <h1>Magyar AI Chat</h1>
  <span class="badge">Qwen API</span>
</header>
<div id="chat">
  <div class="msg bot">Szia! Magyar AI asszisztens vagyok. Miben segíthetek? 😊</div>
</div>
<div class="input-bar">
  <div class="model-bar">
    <span>Model:</span>
    <select id="mdl">
      <option value="qwen-plus">qwen-plus</option>
      <option value="qwen-turbo">qwen-turbo</option>
      <option value="qwen-max">qwen-max</option>
    </select>
  </div>
  <div class="input-inner">
    <textarea id="inp" rows="1" placeholder="Írj üzenetet... (Enter = küld, Shift+Enter = új sor)"></textarea>
    <button id="send" onclick="sendMsg()">&#10148;</button>
  </div>
</div>
<script>
let history=[], busy=false;
const chat=document.getElementById('chat');
function addMsg(role,text,cls){
  const d=document.createElement('div');
  d.className='msg '+(cls||role);
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
async function sendMsg(){
  if(busy)return;
  const inp=document.getElementById('inp');
  const model=document.getElementById('mdl').value;
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';inp.style.height='';
  document.getElementById('send').disabled=true;
  busy=true;
  history.push({role:'user',content:text});
  addMsg('user',text);
  const t=addMsg('bot','Gondolkodom…','bot thinking');
  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history,model})
    });
    const d=await r.json();
    t.remove();
    const reply=d.reply||'Sajnálom, nem tudtam válaszolni.';
    history.push({role:'assistant',content:reply});
    if(history.length>20)history=history.slice(-20);
    addMsg('bot',reply);
  }catch(e){t.remove();addMsg('bot','Hiba: '+e.message);}
  busy=false;
  document.getElementById('send').disabled=false;
  inp.focus();
}
document.getElementById('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}
});
document.getElementById('inp').addEventListener('input',function(){
  this.style.height='';
  this.style.height=Math.min(this.scrollHeight,140)+'px';
});
</script>
</body>
</html>
